# authentication agent
# exec-once = systemctl --user start hyprpolkitagent

# Monitors
monitor=,preferred,auto,auto
source = ./monitors.conf


# Appearance
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 0
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# Decoration
decoration {
    rounding = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1
    # opacity needs to be less than 1 for blur to work.
    inactive_opacity = 1
    shadow {
        enabled = false
        range = 10
        render_power = 3
    }
    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 4
        passes = 3
        ignore_opacity=true
        vibrancy = 0.5
    }
}

animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, almostLinear
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options = caps:escape
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe = false
}

## Hacks
### kitty likes to spawn not tiled for some reason
windowrule = tile, ^(kitty)$


$mod = SUPER # Sets "Windows" key as main modifier
$modshift = $mod + SHIFT

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mod, RETURN, exec, $terminal
bind = $mod, B, exec, $browser

bindm=$mod,mouse:272,movewindow
bindm=$mod,mouse:273,resizewindow
bind=$mod, P, pseudo,
bind=$mod, D, killactive,
bind=$modshift, R, exec, nwg-displays -m ~/.config/hypr/monitors.conf
bind=$mod, F, fullscreen,
bind=$modshift,F,togglefloating

## Changing window
bind=$mod,H,movefocus,l
bind=$mod,L,movefocus,r
bind=$mod,K,movefocus,u
bind=$mod,J,movefocus,d

## Changing window
bind=$modshift,H,movewindow,l
bind=$modshift,L,movewindow,r
bind=$modshift,K,movewindow,u
bind=$modshift,J,movewindow,d

## Changing workspaces
bind=$mod,M,workspace,1
bind=$mod,COMMA,workspace,2
bind=$mod,PERIOD,workspace,3
bind=$mod,SLASH,workspace,4

## moving windows to workspaces
bind=$modshift,M,movetoworkspacesilent,1
bind=$modshift,COMMA,movetoworkspacesilent,2
bind=$modshift,PERIOD,movetoworkspacesilent,3
bind=$modshift,SLASH,movetoworkspacesilent,4

## moving workspaces to monitors
bind=$modshift,Y,movecurrentworkspacetomonitor,l
bind=$modshift,O,movecurrentworkspacetomonitor,r



## color picker
bind=$mod,C,exec,hyprpicker -a


## Screenshot
exec-once=screenshot
bind=$mod,s,exec,slurp | grim -g - - | wl-copy && wl-paste > $(cat ~/.screenshots)/$(date +'%Y-%m-%d-%H%M%S_grim.png')
bind=$mod,r,exec,slurp | wf-recorder -g - - | wl-copy && wl-paste > $(cat ~/.screenshots)/$(date +'%Y-%m-%d-%H%M%S_grim.png')

## volume
bind =, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind =, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde =, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+
binde =, XF86AudioLowerVolume, exec, wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-